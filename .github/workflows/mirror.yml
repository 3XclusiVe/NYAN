name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab Mirror
        run: |
          GITLAB_REPO="https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/self-employed-group7564746/NYAN.git"
          
          git push --prune "$GITLAB_REPO" +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*

